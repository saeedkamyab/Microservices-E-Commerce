services:

  postgres:
    image: postgres:18
    container_name: ecommerce-postgres

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    ports:
      - "15432:5432"

    volumes:
      - postgres-data:/var/lib/postgresql
    
    healthcheck:
        test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
        interval: 5s
        timeout: 5s
        retries: 5
        start_period: 10s

  
  catalog-api:
    image: catalog-api:latest
    container_name: ecommerce-catalog-api

    environment:
        ASPNETCORE_ENVIRONMENT: Development
        ConnectionStrings__CatalogDatabaseConnection: "Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
        OpenTelemetry__OtlpEndpoint: "http://otel-collector:4317"
        
    ports:
      - "5001:8080"

    depends_on:
      postgres:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080; printf \"GET /health HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n\" >&3; grep -q \"200 OK\" <&3'"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - default
      - observability


  api-gateway:
    image: api-gateway:latest
    container_name: ecommerce-api-gateway

    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ReverseProxy__Clusters__catalog-cluster__Destinations__catalog-api__Address: "http://catalog-api:8080/"
      OpenTelemetry__OtlpEndpoint: "http://otel-collector:4317"
      
    ports:
      - "5000:8080"

    depends_on:
      catalog-api:
        condition: service_healthy

    networks:
      - default
      - observability  

  backoffice-web:
    image: backoffice-web:latest
    container_name: ecommerce-backoffice

    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ApiEndpoints__Catalog: "http://api-gateway:8080/"
      OpenTelemetry__OtlpEndpoint: "http://otel-collector:4317"
      
    ports:
      - "5002:8080"

    depends_on:
      - api-gateway
      
    volumes:
      - backoffice-dataprotection:/root/.aspnet/DataProtection-Keys
   
    networks:
      - default
      - observability

volumes:
  postgres-data:
  backoffice-dataprotection:
  
networks:
  observability:
    external: true
    name: ecommerce-observability