services:
#-------------*****----------------------------------------------------------------
#-------------Redis----------------------------------------------------------------
#-------------*****----------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    ports:
        - "6379:6379"
    volumes:
        - redis-data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
        test: ["CMD", "redis-cli", "ping"]
        interval: 10s
        timeout: 5s
        retries: 5
    environment:
        ConnectionStrings__Redis: "redis:6379"



#-------------********----------------------------------------------------------------
#-------------Postgres----------------------------------------------------------------
#-------------********----------------------------------------------------------------

  postgres:
    image: postgres:18
    container_name: ecommerce-postgres

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    ports:
      - "15432:5432"

    volumes:
      - postgres-data:/var/lib/postgresql
    
    healthcheck:
        test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
        interval: 5s
        timeout: 5s
        retries: 5
        start_period: 10s

  
  
#-------------********----------------------------------------------------------------
#-------------Rabbitmq----------------------------------------------------------------
#-------------********----------------------------------------------------------------

  
  rabbitmq:
    image: rabbitmq:4-management
    container_name: ecommerce-rabbitmq

    ports:
      - "5672:5672"
      - "15672:15672"

    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}

    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
  
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s


#-------------***********----------------------------------------------------------------
#-------------Catalog-Api----------------------------------------------------------------
#-------------***********----------------------------------------------------------------
  
  catalog-api:
    image: catalog-api:latest
    container_name: ecommerce-catalog-api

    environment:
        ASPNETCORE_ENVIRONMENT: Development
        ConnectionStrings__CatalogDatabaseConnection: "Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};Maximum Pool Size=15"
        ConnectionStrings__Redis: "redis"
        OpenTelemetry__OtlpEndpoint: "http://otel-collector:4317"
        RabbitMQ__HostName: "rabbitmq"
        RabbitMQ__Port: "5672"
        RabbitMQ__UserName: ${RABBITMQ_DEFAULT_USER}
        RabbitMQ__Password: ${RABBITMQ_DEFAULT_PASS}
        
    ports:
      - "5001:8080"

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
        
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080; printf \"GET /health HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n\" >&3; grep -q \"200 OK\" <&3'"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - default
      - observability

#-------------***********----------------------------------------------------------------
#-------------Api-Gateway----------------------------------------------------------------
#-------------***********----------------------------------------------------------------

  api-gateway:
    image: api-gateway:latest
    container_name: ecommerce-api-gateway

    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ReverseProxy__Clusters__catalog-cluster__Destinations__catalog-api__Address: "http://catalog-api:8080/"
      OpenTelemetry__OtlpEndpoint: "http://otel-collector:4317"
      
    ports:
      - "5000:8080"

    depends_on:
      catalog-api:
        condition: service_healthy

    networks:
      - default
      - observability  



#-------------**************----------------------------------------------------------------
#-------------Backoffice-Web----------------------------------------------------------------
#-------------**************----------------------------------------------------------------

  backoffice-web:
    image: backoffice-web:latest
    container_name: ecommerce-backoffice

    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ApiEndpoints__Catalog: "http://api-gateway:8080/"
      OpenTelemetry__OtlpEndpoint: "http://otel-collector:4317"
      
    ports:
      - "5002:8080"

    depends_on:
      - api-gateway
      
    volumes:
      - backoffice-dataprotection:/root/.aspnet/DataProtection-Keys
   
    networks:
      - default
      - observability

volumes:
  redis-data:
  postgres-data:
  rabbitmq_data:
  backoffice-dataprotection:
  
networks:
  observability:
    external: true
    name: ecommerce-observability